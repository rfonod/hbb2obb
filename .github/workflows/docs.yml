# Documentation site: build with MkDocs on every change that can affect it, deploy to GitHub Pages on release.
#
# 'mkdocs build --strict' runs on pull requests and pushes to main, so a broken link, a docstring the API
# reference cannot parse or a console script without a CLI reference page fails the check before merge.
# Deployment happens only when a release is published (keeping the site in step with PyPI) or when the
# workflow is started by hand on main. Requires Settings -> Pages -> Source: "GitHub Actions", and a 'v*'
# tag rule on the github-pages environment so release tags may deploy.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'hbb2obb/**'
      - 'README.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'hbb2obb/**'
      - 'README.md'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      # The CLI reference calls the installed entry points, so the package is installed with its
      # dependencies; the CPU-only torch wheels avoid several GB of CUDA libraries a docs build never uses.
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict
      - if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/configure-pages@v6
      - if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
